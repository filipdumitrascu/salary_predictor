# The companies whose careers sites are read (sources of the dataset).
#
# Chosen from a first full scan of 72 companies (Nov 2026): kept are the companies with at least
# 10 US job ads that state a salary. Three more are kept because a reader fix recovers their salaries:
# Cloudflare (its cities are in Greenhouse's "offices" field), OpenAI (Ashby gives the pay range in a
# separate field) and Apple (the pay is on each job's page). Left out: companies with no US jobs, and
# companies whose US ads state no salary we can read (IBM, Garmin, Nokia, Jane Street, EA...).
#
# Every block: slug (id), name, industry (set by hand, see README), platform (= a file in readers/),
# and the platform's own settings (board, host, tenant, site...). "domain" is needed by Eightfold.

